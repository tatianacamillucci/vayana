version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vayana-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vayana
    ports:
      - "5432:5432"
    volumes:
      - vayana-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  vayana-postgres-data:
